apiVersion: v1
kind: Secret
metadata:
  name: muni-runtime
type: Opaque
stringData:
  POSTGRES_DSN: "postgres://muni:change-me@postgres.database.svc:5432/muni?sslmode=require"
  BOOTSTRAP_ADMIN: "admin@example.com"
  BOOTSTRAP_ADMIN_PASSWORD: "replace-with-at-least-12-characters"
  ENCRYPTION_KEY: "replace-with-a-base64-encoded-32-byte-key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muni
spec:
  replicas: 1
  selector:
    matchLabels: { app: muni }
  template:
    metadata:
      labels: { app: muni }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: muni
          image: muni:v0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: muni-runtime }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: muni
spec:
  selector: { app: muni }
  ports:
    - { name: http, port: 8080, targetPort: http }
