        '200': { $ref: '#/components/responses/Success' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: muni_session
    bearerKey:
      type: http
      scheme: bearer
      bearerFormat: muni personal API key
  parameters:
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    RevisionRef:
      type: object
      properties:
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
    BlockDiff:
      type: object
      properties:
        status: { type: string, enum: [unchanged, added, removed, changed, moved] }
        blockId: { type: string }
        type: { type: string, description: paragraph, heading, codeBlock, image, horizontalRule or table }
        before: { type: string }
        after: { type: string }
        fromIndex: { type: integer, description: position in the older revision, -1 when the block was added }
        toIndex: { type: integer, description: position in the newer revision, -1 when the block was removed }
        inline:
          type: array
          description: word level breakdown, present on changed blocks
          items:
            type: object
            properties:
              op: { type: string, enum: [equal, insert, delete] }
              text: { type: string }
    TiptapDocument:
      type: object
      required: [type]
      properties:
        type: { const: doc }
        content:
          type: array
          items: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
  responses:
    Success:
      description: Successful envelope
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {}
    Error:
      description: Structured API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
