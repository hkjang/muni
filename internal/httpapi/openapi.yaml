openapi: 3.1.0
info:
  title: muni API
  version: 0.1.0
  description: Offline-first collaborative document REST API. Mutating browser requests use an HttpOnly session cookie; integrations use a scoped personal bearer key.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerKey: []
paths:
  /system/public:
    get:
      security: []
      summary: Login page service and version information
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /system/capabilities:
    get:
      summary: Feature flags available to the current user interface
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/login:
    post:
      security: []
      summary: Create a local browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, password]
              properties:
                identity: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      summary: Current user and build version
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/logout:
    post:
      summary: Delete the browser session
      responses:
        '204': { description: Logged out }
  /workspaces:
    get:
      summary: List accessible workspaces
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a team workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, maxLength: 80 }
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,46}[a-z0-9]$' }
                description: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /workspaces/{workspaceId}/documents:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: List accessible documents in a workspace
      parameters:
        - { name: trash, in: query, schema: { type: boolean } }
        - { name: folderId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, REVIEW, PUBLISHED, ARCHIVED] } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /workspaces/{workspaceId}/folders:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: List the workspace folder tree
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a root or nested folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                parentId: { type: [string, 'null'], format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      summary: List workspace members
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      summary: Add a member or change a non-owner role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string, enum: [MANAGER, MEMBER, VIEWER] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Remove a non-owner workspace member
      responses:
        '204': { description: Member removed }
  /documents:
    get:
      summary: List recent, favorite, shared, owned, or trashed documents
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [recent, favorites, shared, owned, trash] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string, format: uuid }
                folderId: { type: [string, 'null'], format: uuid }
                title: { type: string, maxLength: 240 }
                content: { $ref: '#/components/schemas/TiptapDocument' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /import:
    post:
      summary: Import PDF, DOCX, Markdown, TXT, or HTML as a document
      description: >-
        Headings, lists (including nesting and task lists), tables with merged
        cells, inline formatting, links and embedded images are preserved for
        every format. Images become attachments on the created document.
        Remote image URLs are not fetched. PDFs without a text layer are
        rejected with IMPORT_PARSE_FAILED.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [workspaceId, file]
              properties:
                workspaceId: { type: string, format: uuid }
                folderId: { type: string, format: uuid }
                title: { type: string, maxLength: 240 }
                file:
                  type: string
                  format: binary
                  description: .pdf, .docx, .md, .markdown, .txt, .html or .htm
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Read a document after ACL evaluation
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: Save document content or metadata using optimistic revision control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                title: { type: string, maxLength: 240 }
                content: { $ref: '#/components/schemas/TiptapDocument' }
                status: { type: string, enum: [DRAFT, REVIEW, PUBLISHED, ARCHIVED] }
                pageHeader: { type: string, maxLength: 200, description: "One line printed at the top of every page — where a Korean office document carries 대외비 and the department. Whitespace is collapsed: a header is one line." }
                pageFooter: { type: string, maxLength: 200, description: "One line printed at the bottom left; page numbers go on the right. Empty means the document title." }
                visibility: { type: string, enum: [RESTRICTED, WORKSPACE, ORGANIZATION, LINK] }
                reason: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Soft-delete a document
      responses:
        '204': { description: Moved to trash }
  /documents/{documentId}/comments:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: List comment threads
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Add a range-linked comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                parentId: { type: [string, 'null'], format: uuid }
                anchor: { type: [object, 'null'] }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /documents/{documentId}/permissions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: List explicit document permissions
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      summary: Grant or update a user document permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectType, subjectId, role]
              properties:
                subjectType: { const: USER }
                subjectId: { type: string, format: uuid }
                role: { type: string, enum: [EDITOR, COMMENTER, VIEWER] }
                expiresAt: { type: [string, 'null'], format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /documents/{documentId}/suggestions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: List document suggestions
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a range-based change suggestion
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /documents/{documentId}/links:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List the share links on a document
      description: >-
        Owner only. Returns each link's prefix — enough to tell two apart on
        screen, not enough to open one. The token is returned when the link is
        created and never again; it is stored only as a hash.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a read-only public link
      description: >-
        Owner only, and refused entirely while the `allowPublicLinks` policy is
        off. The response carries the only copy of the token muni will ever
        produce. Links are read-only: an anonymous editor would make changes
        with nobody to attribute them to.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100, description: For telling links apart later }
                password: { type: string, minLength: 4, description: Optional second factor, stored hashed }
                expiresAt: { type: string, format: date-time }
                maxViews: { type: integer, minimum: 1, maximum: 100000, description: Enforced in the same statement that counts the view, so a last view cannot be used twice }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/links/{linkId}:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke a share link
      description: >-
        The row is kept, marked revoked: it is the record that this document
        was shared outside and how often it was opened.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /public/documents/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      summary: Open a document with a share link
      description: >-
        The only endpoint that answers without a session. POST because the
        password travels in the body — in a query string it would sit in
        browser history, proxy logs, and the Referer of every request the page
        makes. A wrong token and an unknown one give the same 404. The response
        carries the document and nothing else: no workspace, no owner, no
        neighbouring documents.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/revisions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: List immutable document revisions
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /documents/{documentId}/presentations:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: List the presentations made from this document
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Turn the document into a presentation
      description: >-
        The document's structure — headings, lists, tables, figures — is sent to
        the configured presentation service, which designs and builds the deck.
        muni stores only the link between the document revision and the deck;
        the slides and the built file stay with that service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                audience: { type: string }
                purpose: { type: string }
                tone: { type: string }
                language: { type: string }
                slideCount: { type: integer, minimum: 1, maximum: 50 }
                minutes: { type: integer, description: how long the presentation has to run }
                detail: { type: string }
                theme: { type: string }
                templateId: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/presentations/{presentationId}/status:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Ask the presentation service how generation is going
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/presentations/{presentationId}/download:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: format, in: query, schema: { type: string, enum: [pptx, pdf], default: pptx } }
    get:
      summary: Download the built presentation
      description: >-
        Streamed from the presentation service on request. muni keeps no copy:
        the deck can be edited there afterwards, and a stored file would go
        stale the moment that happens.
      responses:
        '200':
          description: PowerPoint or PDF file
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/presentations/{presentationId}/sync:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: What a document change means for this presentation
      description: >-
        Compares the revision the deck was built from with the current one and
        reports, per slide, whether it should be kept, redrafted, added or
        removed. Nothing is changed; this is what a person reviews first.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Redraft only the slides the document change reached
      description: >-
        Rebuilding a whole deck discards the work someone did in the
        presentation editor. Only the slides whose section changed are put in
        front of the model again; the rest keep their exact text. A conflict
        means the deck was edited in the presentation service meanwhile and the
        request should be retried.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/presentations/{presentationId}/citations:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Write the document and revision each slide came from onto the slide
      description: >-
        A deck that states a number and cannot say where it came from is the
        first thing anyone asks about. muni knows which heading each slide was
        built from, so it writes that as the slide's source line. Cover and
        closing slides make no claim and are skipped, slides that already cite
        something are left alone, and running this twice adds nothing.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/presentations/{presentationId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keepRemote, in: query, schema: { type: boolean, default: false }, description: leave the deck in the presentation service }
    delete:
      summary: Unlink a presentation from the document
      responses:
        '204': { description: Unlinked }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/ai/patch:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Ask the model to propose block level edits
      description: >-
        The model rewrites whole blocks and the result is stored as pending
        suggestions anchored to the block each one is about. Nothing is applied:
        the proposals join the same review queue a colleague's suggestion does,
        and a person accepts or rejects each one. Only blocks that carry a
        stable id can be proposed against.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, description: how the document should be changed }
                blockIds:
                  type: array
                  description: limit the proposal to these blocks
                  items: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/revisions/{from}/diff/{to}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: from, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: to, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      summary: Compare two revisions block by block
      description: >-
        Blocks are paired by their stable blockId, so inserting a paragraph does
        not make everything below it read as changed. Each block is reported as
        unchanged, added, removed, changed or moved; a changed block carries a
        word-level breakdown.
      responses:
        '200':
          description: Block level comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from: { $ref: '#/components/schemas/RevisionRef' }
                      to: { $ref: '#/components/schemas/RevisionRef' }
                      summary:
                        type: object
                        properties:
                          added: { type: integer }
                          removed: { type: integer }
                          changed: { type: integer }
                          moved: { type: integer }
                          unchanged: { type: integer }
                      blocks:
                        type: array
                        items: { $ref: '#/components/schemas/BlockDiff' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/export/{format}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: format
        in: path
        required: true
        schema: { type: string, enum: [docx, pdf, html, md, txt] }
    get:
      summary: Export a document
      description: >-
        DOCX exports carry styles, numbering, tables, images and hyperlinks.
        PDF export renders the document through headless Chromium. Both can be
        disabled by administrator policy.
      responses:
        '200':
          description: Exported binary or text document
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/workflow/submit:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Submit the current revision when approval workflow is enabled
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /search:
    get:
      summary: ACL-filtered PostgreSQL full-text search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /approvals:
    get:
      summary: List approval requests visible to the current reviewer
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /approvals/{approvalId}/decision:
    parameters:
      - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Approve or reject a pending request
      responses:
        '204': { description: Decision recorded }
  /ai/chat:
    post:
      summary: Stream an OpenAI-compatible chat response using SSE
      description: >-
        With `tools: true` the model may search and read documents before it
        answers. Every tool applies the caller's own document ACL, so the agent
        cannot reach anything the person asking would not be shown, and every
        call is written to the audit log. Tools only read; changing a document
        stays a proposal the author accepts. Each call is reported on the stream
        as an `event: tool` frame before the answer arrives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                documentId: { type: [string, 'null'], format: uuid }
                action: { type: string }
                tools:
                  type: boolean
                  description: let the model search and read documents before answering
                maxTokens: { type: integer, minimum: 1, maximum: 262144 }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [system, user, assistant, tool] }
                      content: {}
      responses:
        '200':
          description: Server-Sent Events from the configured model
          content:
            text/event-stream: { schema: { type: string } }
  /me/keys:
    get:
      summary: List personal envelope-key versions without key material
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /me/keys/rotate:
    post:
      summary: Atomically retire and replace the active personal key
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /me/keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke one retired personal envelope-key version
      responses:
        '204': { description: Retired key revoked }
        '409': { $ref: '#/components/responses/Error' }
  /me/api-keys:
    get:
      summary: List personal integration keys without secrets
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a scoped key; the secret is returned once
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /me/api-keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke a personal integration key
      responses:
        '204': { description: Integration key revoked }
  /admin/settings:
    get:
      summary: Read all non-secret administrative settings
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      summary: Validate and atomically update administrative settings
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/audit:
    get:
      summary: Read immutable operational audit events
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/users:
    get:
      summary: Search, filter, sort, and page through service users
      description: >-
        Returns `{items, total, limit, offset}`. `total` counts every match,
        not the page. `sort` is matched against a fixed set and falls back to
        `recent` for anything else — it never reaches the query.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches username, email, or display name }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { name: role, in: query, schema: { type: string, enum: [ADMIN, USER] } }
        - { name: auth, in: query, schema: { type: string, enum: [LOCAL, SSO] }, description: Whether the account has a local password or an identity-provider subject }
        - { name: inactiveDays, in: query, schema: { type: integer, minimum: 0, maximum: 3650 }, description: "Not signed in for this many days. An account that never signed in always matches." }
        - { name: pendingPassword, in: query, schema: { type: boolean }, description: Still holding a password somebody else chose }
        - { name: sort, in: query, schema: { type: string, enum: [recent, oldest, lastLogin, stale, name], default: recent } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a local account
      description: >-
        Creates the user, their personal workspace, the membership, and the
        wrapped data key in one transaction. Omit `password` and muni generates
        one, returned as `temporaryPassword` in this response and nowhere else.
        Either way the account must replace the password before it can use any
        other endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                username: { type: string, description: Derived from the email when omitted; a collision gets a numeric suffix }
                displayName: { type: string, maxLength: 100 }
                role: { type: string, enum: [ADMIN, USER], default: USER }
                locale: { type: string, default: ko-KR }
                password: { type: string, minLength: 12, description: Omit to have muni generate one }
                sendEmail: { type: boolean, default: false, description: Mail the credentials; needs SMTP configured }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/import:
    post:
      summary: Create accounts in bulk from a CSV
      description: >-
        Multipart upload of a `file` field. The first line names the columns;
        only `email` (or `이메일`) is required. Every row is reported
        individually with its generated password or the reason it failed — one
        bad row does not reject the rest.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /admin/documents/{documentId}/access:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Who can open this document right now
      description: >-
        The audit log answers who did open a document. This answers who can —
        the question an audit starts with. Combines ownership, direct grants
        (expired ones excluded), and workspace membership under the same
        precedence documentRole enforces, so a person appears once with the
        role they actually get. Administrators are returned as a count, not
        enumerated: they reach every document, and listing them per document
        would make each one look individually over-shared.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/belongings:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: What a user holds, for offboarding
      description: >-
        Counts of documents, shared workspaces, memberships, API keys, open
        sessions, and — the one that matters most — approval steps waiting on
        this person. Each of those is a document nobody else can move forward.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/offboard:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Hand over everything a departing user holds, then suspend them
      description: >-
        One transaction: documents and shared workspaces move to `transferTo`
        (who is added to the affected workspaces), approval steps are reassigned
        or skipped, API keys are revoked, sessions end, and the account is
        suspended. The account is never deleted — the tables that record what a
        person did reference them without ON DELETE, and that is deliberate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transferTo]
              properties:
                transferTo: { type: string, format: uuid, description: Must be an ACTIVE account }
                includeTrashed: { type: boolean, default: false }
                reassignApprovals: { type: boolean, default: false, description: A request whose line is emptied is cancelled and its document returns to DRAFT — never auto-approved }
                revokeApiKeys: { type: boolean, default: false }
                endSessions: { type: boolean, default: false }
                suspend: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Change a service user's role or account status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/users/{userId}/keys:
