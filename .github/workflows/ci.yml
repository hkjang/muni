name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the committed frontend placeholder
        run: scripts/check-webui-placeholder.sh
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Frontend typecheck and build
        run: npm run build
        working-directory: frontend
      - name: Frontend unit tests
        run: npm test
        working-directory: frontend
      - name: Go tests
        run: go test ./...
      - name: Build Linux binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/muni ./cmd/muni

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: muni:v0.0.0-ci
          build-args: |
            VERSION=v0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_TIME=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
