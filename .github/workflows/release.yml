name: Offline image release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          value="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$value" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $value" >&2
            exit 2
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build offline service image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: muni:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create tar.gz containing the tagged image
        shell: bash
        run: docker save "muni:${{ steps.version.outputs.value }}" | gzip -9 > "muni-${{ steps.version.outputs.value }}.tar.gz"
      - name: Verify archive image tag
        shell: bash
        run: |
          mkdir verification
          gzip -dc "muni-${{ steps.version.outputs.value }}.tar.gz" > verification/image.tar
          tar -xOf verification/image.tar manifest.json | grep -F 'muni:${{ steps.version.outputs.value }}'
      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: muni ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: muni-${{ steps.version.outputs.value }}.tar.gz
